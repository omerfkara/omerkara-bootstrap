name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (hata düzeyi)
        run: shellcheck -S error bin/omk lib/common.sh install.sh tests/test_common.sh tests/test_templates.sh
      - name: lib/orch.py birim testleri
        run: python3 -m unittest discover -s tests -v
      - name: lib/common.sh yardımcıları
        run: bash tests/test_common.sh
      - name: şablonlar CLI ile tutarlı
        run: bash tests/test_templates.sh
